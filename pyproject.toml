[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rttfc"
version = "0.1.0"
description = "Road to the Fall Classic — predicting World Series success from regular-season stats"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Devin Sciarrino" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "pybaseball>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
